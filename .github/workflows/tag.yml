name: Tag release

# A merge to main that changes package.json's version tags it v<version>,
# which is what apps install: github:Re11oy/kir-lint#v<version>.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag the version if it's new
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
